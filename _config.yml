# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name:
blog_nav_title:
blog_description: some technical summaries
permalink: /posts/:year/:title/

pagination:
  enabled: true

related_blog_posts:
  enabled: false
  max_related: 3

# Giscus comments (RECOMMENDED)
